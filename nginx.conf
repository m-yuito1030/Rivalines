server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  location /api/ { proxy_pass http://server:8091; proxy_set_header X-Real-IP $remote_addr; }
  location /ws { proxy_pass http://server:8091; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  # HTML は毎回確認する(再ビルド後に古い index.html が残ると、消えた古いファイルを読みにいって「Importing a module script failed」になる)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
  # 配信物(ファイル名にハッシュ付き)。無いファイルは index.html を返さず 404 にする(古い画面がエラーを検知して再読み込みできるように)
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security-headers.inc; }
}
