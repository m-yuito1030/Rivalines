# 接続元ごとの頻度・同時接続の制限(アプリ側の制限とは別に、Node に届く前に止める)
limit_req_zone $binary_remote_addr zone=api_all:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  # ゆっくり送り続けて接続を占有する攻撃(slowloris)への備えと、小さな本文だけ受け付ける
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  client_max_body_size 8k;
  limit_req_status 429;
  limit_conn_status 429;

  # 登録・ログインは特に厳しく(総当たり対策。アプリ側でも接続元ごとに制限している)
  location ~ ^/api/(login|register)$ { limit_req zone=api_auth burst=10 nodelay; proxy_pass http://server:8091; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { limit_req zone=api_all burst=100 nodelay; proxy_pass http://server:8091; proxy_set_header X-Real-IP $remote_addr; }
  location /ws { limit_conn ws_conn 10; proxy_pass http://server:8091; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  # HTML は毎回確認する(再ビルド後に古い index.html が残ると、消えた古いファイルを読みにいって「Importing a module script failed」になる)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
  # 配信物(ファイル名にハッシュ付き)。無いファイルは index.html を返さず 404 にする(古い画面がエラーを検知して再読み込みできるように)
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security-headers.inc; }
}
