# Limits on rate and concurrent connections per source (separate from the app's limits, stopping traffic before it reaches Node)
limit_req_zone $binary_remote_addr zone=api_all:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

server {
  listen 80;
  server_tokens off;
  # Text files (the license notice, the HTML pages) are UTF-8. Without this the browser guesses the encoding and shows Japanese as garbage
  charset utf-8;
  # When Caddy (HTTPS) is in front, take the real source from X-Forwarded-For (trust only connections from docker's internal network)
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  # Keep no access log (IP addresses are not stored). Only the error log remains
  access_log off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  # Protection against attacks that hold connections by sending slowly (slowloris), and accept only small bodies
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  client_max_body_size 8k;
  limit_req_status 429;
  limit_conn_status 429;

    # Registration and login are especially strict (against brute force. The app also limits per source)
  # The operator API (/api/admin) is not reachable from outside. Use it only from inside the server (docker compose exec)
  location ^~ /api/admin { return 404; }
  location ~ ^/api/(login|register|password|leave)$ { limit_req zone=api_auth burst=10 nodelay; proxy_pass http://server:8091; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { limit_req zone=api_all burst=100 nodelay; proxy_pass http://server:8091; proxy_set_header X-Real-IP $remote_addr; }
  location /ws { limit_conn ws_conn 10; proxy_pass http://server:8091; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  # Always revalidate the HTML (if a stale index.html remains after a rebuild, it tries to read old files that are gone and shows "Importing a module script failed")
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
  # Distributed files (with hashes in file names). A missing file returns 404 instead of index.html (so a stale page can detect the error and reload)
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security-headers.inc; }
}
