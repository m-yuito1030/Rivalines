# Rivalines layout: run production (live) and the next version (next) side by side.
#   web         ... the entrance (portal + /live/ + /next/). Published on :8092
#   server      ... the production world (production code, placed at LIVE_SRC). Owner of the accounts
#   server-next ... the next version's world (this repository's code). Its data may be wiped. It uses the live side's accounts read-only
# Steps are in docs/ENVIRONMENTS.md. LIVE_SRC is the folder holding the production code (prepared by scripts/live-checkout.sh).
services:
  web:
    build:
      context: .
      target: gateway
      additional_contexts:
        live: ${LIVE_SRC:-../rivalines-live}
    container_name: ${PROJECT:-simulator-multi}-web
    restart: unless-stopped
    depends_on: [server, server-next]
    mem_limit: 256m
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    ports:
      - "${GATEWAY_PORT:-8092}:80"
  server:
    build: { context: "${LIVE_SRC:-../rivalines-live}", target: server }
    container_name: ${PROJECT:-simulator-multi}-server
    restart: unless-stopped
    stop_grace_period: 30s # on the termination signal, save the world before exiting
    mem_limit: 3g
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    environment:
      WORLD_SIZE: "65535"
      SPEED: "${SPEED:-0.5}" # game speed. 1 = one game day per 30 real minutes, 0.5 = one day per 60 minutes
      MAX_ONLINE: "100" # max concurrent connections (there is no cap on the number of accounts)
      REGISTER_PER_HOUR: "300" # server-wide cap on new registrations per hour (against bots)
      ADMIN_KEY: "${ADMIN_KEY:-}"
      ENV_NAME: live
      ENV_LABEL: 本稼働
      APP_VERSION: "${LIVE_VERSION:-dev}"
    volumes:
      - multi-data:/data
  server-next:
    build: { context: ., target: server }
    container_name: ${PROJECT:-simulator-multi}-server-next
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 3g
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    environment:
      WORLD_SIZE: "4096" # the next version uses a fixed-size world (its data may be wiped). If an older save has a different size, a new world is made
      WORLD_PREGEN: "1" # at startup, generate the towns of every region
      MAX_ONLINE: "30" # a world for testing, so fewer concurrent connections
      ADMIN_KEY: "${ADMIN_KEY:-}"
      ENV_NAME: next
      ENV_LABEL: 次期バージョン
      APP_VERSION: "${NEXT_VERSION:-dev}"
            # Use the live side's accounts read-only (/shared below is mounted read-only)
      ACCOUNTS_FROM: /shared
    volumes:
      - next-data:/data
      - multi-data:/shared:ro
volumes:
  multi-data: # the production world and accounts (never delete)
  next-data: # the next version's world (may be wiped)
