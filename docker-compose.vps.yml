# Layout for publishing on a Sakura VPS (Ubuntu 24.04, 4 GB of memory).
# See docs/DEPLOY_VPS.md for usage. docker compose -f docker-compose.vps.yml up -d --build
# To avoid clashing with 80/443 used by existing services, normally only a different port (WEB_PORT, default 8092) is opened.
# Use Caddy (HTTPS) only when nothing else uses 80/443: docker compose -f docker-compose.vps.yml --profile https up -d --build
services:
  caddy:
    image: caddy:2-alpine
    container_name: rivalines-caddy
    profiles: [https] # not started by default
    restart: unless-stopped
    depends_on: [rivalines-web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # the obtained certificates (deleting it means obtaining them again)
      - caddy-config:/config
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    # The entrance (gateway): serves the portal (/), production (/live/), and the next version (/next/) on one port.
    # Names are prefixed with rivalines- (so they do not clash even when connected to the same network as other services)
  rivalines-web:
    build:
      context: .
      target: gateway
      additional_contexts:
        live: ${LIVE_SRC:-.} # the production code. By default this place (the same version as next). To split the versions, point at the place prepared by scripts/live-checkout.sh
    container_name: rivalines-web
    restart: unless-stopped
    depends_on: [server, server-next]
    mem_limit: 256m
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8092}:80"
    # The production world (owner of the accounts). The service name `server` is referenced by the entrance config, so do not change it
  server:
    build: { context: "${LIVE_SRC:-.}", target: server }
    container_name: rivalines-server
    restart: unless-stopped
    stop_grace_period: 30s # on the termination signal, save the world before exiting
    mem_limit: 2800m # of the 4 GB of memory, leave room for the OS, Caddy, nginx, and the next version
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    environment:
      WORLD_SIZE: "65535"
      SPEED: "${SPEED:-0.5}" # game speed. 1 = one game day per 30 real minutes, 0.5 = one day per 60 minutes
      MAX_ONLINE: "${MAX_ONLINE:-100}"
      REGISTER_PER_HOUR: "${REGISTER_PER_HOUR:-300}"
      ADMIN_KEY: "${ADMIN_KEY:?.env に ADMIN_KEY=長いランダムな文字列 を書いてください}"
      ENV_NAME: live
      ENV_LABEL: 本稼働
      APP_VERSION: "${LIVE_VERSION:-dev}"
    volumes:
      - rivalines-data:/data
    # The next version's trial world (fixed at 2048x2048; its data may be wiped). It uses the live side's accounts read-only
  server-next:
    build: { context: ., target: server }
    container_name: rivalines-server-next
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 400m # a small world (about 150 MB of memory). At most 30 concurrent connections
    pids_limit: 200
    security_opt: [no-new-privileges:true]
    environment:
      WORLD_SIZE: "2048"
      WORLD_PREGEN: "1"
      SPEED: "${SPEED:-0.5}"
      MAX_ONLINE: "30"
      ADMIN_KEY: "${ADMIN_KEY:?.env に ADMIN_KEY=長いランダムな文字列 を書いてください}"
      ENV_NAME: next
      ENV_LABEL: 次期バージョン
      APP_VERSION: "${NEXT_VERSION:-dev}"
      ACCOUNTS_FROM: /shared
    volumes:
      - rivalines-next:/data
      - rivalines-data:/shared:ro
volumes:
  rivalines-data:
  rivalines-next: # the next version's world (may be wiped)
  caddy-data:
  caddy-config:
