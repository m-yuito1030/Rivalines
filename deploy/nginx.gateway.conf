# The entrance (gateway): serves the portal (/), production (/live/), and the next version (/next/) at one address.
#  - /          ... the portal (log in and choose a world)
#  - /live/ /next/ ... the respective clients. The API and WebSocket connect to each one's own world (server)
#  - /api /ws   ... the earlier addresses (production). For old pages and bookmarks
#  - Login, registration, password, and leaving are always sent to the production side (the owner of the accounts) from either screen
limit_req_zone $binary_remote_addr zone=api_all:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

server {
  listen 80;
  server_tokens off;
  # Text files (the license notice, the HTML pages) are UTF-8. Without this the browser guesses the encoding and shows Japanese as garbage
  charset utf-8;
  # Keep no access log (IP addresses are not stored). Only the error log remains
  access_log off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  client_max_body_size 8k;
  limit_req_status 429;
  limit_conn_status 429;
  # The entrance can start even if one server is down (the destination is looked up by name on every connection)
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $live_up http://server:8091;
  set $next_up http://server-next:8091;

  # The operator API is not reachable from outside (use it from inside the server with docker compose exec)
  location ~ ^(/live|/next)?/api/admin { return 404; }

  # Login, registration, password, and leaving: always the production side (the owner of the accounts)
  location ~ ^(?:/live|/next)?/api/(?:login|register|password|leave)$ {
    limit_req zone=api_auth burst=10 nodelay;
    rewrite ^(?:/live|/next)?(/api/.*)$ $1 break;
    proxy_pass $live_up;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The next version's API and WebSocket
  location /next/api/ { limit_req zone=api_all burst=100 nodelay; rewrite ^/next(/api/.*)$ $1 break; proxy_pass $next_up; proxy_set_header X-Real-IP $remote_addr; }
  location /next/ws { limit_conn ws_conn 10; rewrite ^/next(/ws)$ $1 break; proxy_pass $next_up; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }

  # The production API and WebSocket (both /live/ and the earlier /api /ws)
  location /live/api/ { limit_req zone=api_all burst=100 nodelay; rewrite ^/live(/api/.*)$ $1 break; proxy_pass $live_up; proxy_set_header X-Real-IP $remote_addr; }
  location /live/ws { limit_conn ws_conn 10; rewrite ^/live(/ws)$ $1 break; proxy_pass $live_up; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  location /api/ { limit_req zone=api_all burst=100 nodelay; proxy_pass $live_up; proxy_set_header X-Real-IP $remote_addr; }
  location /ws { limit_conn ws_conn 10; proxy_pass $live_up; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }

  # Distributed files (with hashes in file names). A missing file returns 404 (so a stale page can detect the error and reload)
  location ~ ^/(live|next)/assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security-headers.inc; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security-headers.inc; }

  # Client (/live/ /next/): always revalidate the HTML
  location /live/ { try_files $uri $uri/ /live/index.html; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex" always; include /etc/nginx/conf.d/security-headers.inc; }
  location /next/ { try_files $uri $uri/ /next/index.html; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex" always; include /etc/nginx/conf.d/security-headers.inc; }
  # The portal (/)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
}
