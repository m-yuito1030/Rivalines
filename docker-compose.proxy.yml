# 同じ VPS の別のプロキシ(例: trailpin の Caddy)に HTTPS を任せるときの追加設定。
# 使い方: docker compose -f docker-compose.vps.yml -f docker-compose.proxy.yml up -d --build
# 相手のプロキシからは、rivalines-web:80 で届く。
services:
  rivalines-web:
    networks: [default, proxy]
networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-trailpin_default}"
