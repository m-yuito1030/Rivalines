# Extra settings for leaving HTTPS to another proxy on the same VPS (e.g. trailpin's Caddy).
# Usage: docker compose -f docker-compose.vps.yml -f docker-compose.proxy.yml up -d --build
# The other proxy reaches it at rivalines-web:80.
services:
  rivalines-web:
    networks: [default, proxy]
networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-trailpin_default}"
